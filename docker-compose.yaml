x-kirfeed-app: &kirfeed-app
  build:
    context: .
    dockerfile: Dockerfile
  image: kirfeed:local
  restart: unless-stopped
  environment:
    CONFIG_PATH: configs/config.docker.yaml
    JWT_SECRET: ${JWT_SECRET:-kirfeed-local-dev-secret-change-me}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    container_name: kirfeed-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "666666"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: kirfeed
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p666666"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: kirfeed-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "666666"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "666666", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: kirfeed-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "666666"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    <<: *kirfeed-app
    container_name: kirfeed-api
    command: ["./kirfeed-api"]
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/.run/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *kirfeed-app
    container_name: kirfeed-worker
    command: ["./kirfeed-worker"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  uploads_data:
